name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm install archiver

      - run: npm run build

      - name: Pack Chrome .crx
        run: |
          echo "${{ secrets.CHROME_PRIVATE_KEY }}" > chrome.pem
          node scripts/pack-crx.mjs Translate ez-translate-chrome.crx

      - name: Pack Edge .crx
        run: |
          echo "${{ secrets.EDGE_PRIVATE_KEY }}" > edge.pem
          node scripts/pack-crx.mjs Translate ez-translate-edge.crx

      - name: Get version
        id: version
        run: echo "v=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.v }}
          name: EZ-Translate v${{ steps.version.outputs.v }}
          files: |
            ez-translate-chrome.crx
            ez-translate-edge.crx
          body: |
            ## 安装说明

            ### Chrome 版本
            1. 下载 `ez-translate-chrome.crx`
            2. 地址栏输入 `chrome://extensions/`
            3. 开启右上角"开发者模式"
            4. 拖拽 `.crx` 到页面即可安装

            ### Edge 版本
            1. 下载 `ez-translate-edge.crx`
            2. 地址栏输入 `edge://extensions/`
            3. 开启左下角"开发者模式"
            4. 拖拽 `.crx` 到页面即可安装

            > 如果拖拽安装失败，请解压 ZIP 包后用"加载已解压的扩展程序"方式安装。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build:all

      - name: Pack Chrome ZIP
        run: |
          cd dist/chrome
          zip -r ../../ez-translate-chrome.zip . -x "*.DS_Store" -x "*.git*"

      - name: Pack Edge ZIP
        run: |
          cd dist/chrome
          zip -r ../../ez-translate-edge.zip . -x "*.DS_Store" -x "*.git*"

      - name: Pack Firefox ZIP
        run: |
          cd dist/firefox
          zip -r ../../ez-translate-firefox.zip . -x "*.DS_Store" -x "*.git*"

      - name: Get version
        id: version
        run: echo "v=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.v }}
          name: EZ-Translate v${{ steps.version.outputs.v }}
          files: |
            ez-translate-chrome.zip
            ez-translate-edge.zip
            ez-translate-firefox.zip
          body: |
            ## 安装说明

            ### Chrome 版本
            1. 下载 `ez-translate-chrome.zip` 并解压
            2. 地址栏输入 `chrome://extensions/`
            3. 开启右上角"开发者模式"
            4. 点击"加载已解压的扩展程序"
            5. 选择解压后的文件夹

            ### Edge 版本
            1. 下载 `ez-translate-edge.zip` 并解压
            2. 地址栏输入 `edge://extensions/`
            3. 开启左下角"开发者模式"
            4. 点击"加载扩展"
            5. 选择解压后的文件夹

            ### Firefox 版本
            1. 下载 `ez-translate-firefox.zip` 并解压
            2. 地址栏输入 `about:debugging#/runtime/this-firefox`
            3. 点击"临时载入附加组件"
            4. 选择解压文件夹中的 `manifest.json`

            > 💡 **提示：** Chrome/Edge 版本无需签名即可使用。Firefox 临时加载方式每次重启浏览器需重新加载。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

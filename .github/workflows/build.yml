name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Pack .crx extension
        run: node scripts/pack-crx.mjs Translate ez-translate.crx

      - name: Get version
        id: version
        run: echo "v=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.v }}
          name: EZ-Translate v${{ steps.version.outputs.v }}
          files: ez-translate.crx
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

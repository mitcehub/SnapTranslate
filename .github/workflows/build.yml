name: Build Extension

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Upload extension directory
        uses: actions/upload-artifact@v4
        with:
          name: ez-translate-extension
          path: Translate/
          retention-days: 30

      - name: Package as zip for Chrome Web Store
        run: |
          mkdir -p dist
          cd Translate
          zip -r ../dist/ez-translate.zip \
            manifest.json \
            options.html \
            assets/ \
            static/ \
            _locales/

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: ez-translate-zip
          path: dist/ez-translate.zip
          retention-days: 30

name: Build Extension

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Package extension
        run: |
          cd Translate
          zip -r ../ez-translate.zip \
            manifest.json \
            options.html \
            assets/ \
            static/ \
            _locales/

      - uses: actions/upload-artifact@v4
        with:
          name: ez-translate
          path: ez-translate.zip
          retention-days: 30
